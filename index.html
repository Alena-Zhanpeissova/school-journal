<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Электронный журнал</title>
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280; --line: #e5e7eb;
    --accent: #2f5bd3; --accent-text: #ffffff; --g5: #1f9d55; --g4: #3b82f6; --g3: #d97706; --g2: #dc2626;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #14161b; --card: #1d2027; --text: #e7e9ee; --muted: #9aa1ad; --line: #2c3039; --accent: #7aa2ff; --accent-text: #10131a; }
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 980px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  .sub { color: var(--muted); margin: 0 0 20px; }
  input, select, button { font: inherit; }
  input, select { width: 100%; padding: 9px 10px; border: 1px solid var(--line); border-radius: 8px;
                  background: var(--card); color: var(--text); }
  button { padding: 9px 16px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-text);
           font-weight: 600; cursor: pointer; }
  button.ghost { background: transparent; color: var(--accent); border: 1px solid var(--line); }
  button:disabled { opacity: .6; cursor: default; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .login { max-width: 360px; margin: 8vh auto 0; background: var(--card); border: 1px solid var(--line);
           border-radius: 12px; padding: 24px; display: grid; gap: 12px; }
  .login h1 { font-size: 22px; }
  .login label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .login .err { min-height: 1.2em; }

  .who { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap;
         background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin-bottom: 16px; }
  .who b { display: block; }
  .who span { color: var(--muted); font-size: 14px; }

  .filters { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; margin-bottom: 14px; }
  .stats { display: flex; gap: 18px; flex-wrap: wrap; color: var(--muted); margin-bottom: 10px; font-size: 14px; }
  .stats b { color: var(--text); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 10px 14px; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 13px; color: var(--muted); font-weight: 600; }
  tr:last-child td { border-bottom: 0; }
  .grade { display: inline-block; min-width: 28px; text-align: center; padding: 2px 8px; border-radius: 6px;
           color: #fff; font-weight: 700; }
  .g5 { background: var(--g5); } .g4 { background: var(--g4); } .g3 { background: var(--g3); } .g2 { background: var(--g2); }
  .msg { padding: 28px; text-align: center; color: var(--muted); }
  .err { color: var(--g2); }
  .gradeForm { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px;
               margin-bottom: 16px; display: grid; gap: 12px; }
  .gradeForm h2 { margin: 0; font-size: 16px; }
  .gf-row { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 10px; }
  .gf-row label { display: grid; gap: 4px; font-size: 13px; color: var(--muted); }
  .gf-bottom { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .marks { border: 0; padding: 0; margin: 0; display: flex; gap: 8px; align-items: center; }
  .marks legend { font-size: 13px; color: var(--muted); padding: 0; margin-bottom: 4px; }
  .marks label { display: block; cursor: pointer; }
  .marks input { position: absolute; opacity: 0; pointer-events: none; }
  .marks span { display: inline-block; width: 42px; padding: 7px 0; text-align: center; border-radius: 8px;
                font-weight: 700; color: #fff; opacity: .35; }
  .marks input:checked + span { opacity: 1; outline: 2px solid var(--text); outline-offset: 2px; }
  .marks input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
  .gf-msg { font-size: 14px; min-height: 1.2em; }
  .gf-msg.ok { color: var(--g5); }
  tr.fresh td { background: color-mix(in srgb, var(--g5) 14%, transparent); }
  @media (max-width: 640px) {
    .gf-row { grid-template-columns: 1fr; }
    .filters { grid-template-columns: 1fr; }
    th, td { padding: 8px 10px; }
  }
</style>
</head>
<body>
<main>
  <!-- Вход -->
  <form id="loginForm" class="login" hidden>
    <h1>Электронный журнал</h1>
    <p class="sub" style="margin:0">Войдите, чтобы увидеть оценки.</p>
    <label>Логин <input id="login" autocomplete="username" required></label>
    <label>Пароль <input id="password" type="password" autocomplete="current-password" required></label>
    <button id="loginBtn" type="submit">Войти</button>
    <div id="loginErr" class="err" role="alert"></div>
  </form>

  <!-- Журнал -->
  <section id="journalView" hidden>
    <h1>Электронный журнал</h1>
    <p class="sub">Оценки из учебной базы «Школа».</p>

    <div class="who">
      <div><b id="whoName"></b><span id="whoScope"></span></div>
      <button id="logoutBtn" class="ghost" type="button">Выйти</button>
    </div>

    <!-- Форма оценки: видна только учителю -->
    <form id="gradeForm" class="gradeForm" hidden>
      <h2>Поставить оценку</h2>
      <div class="gf-row">
        <label class="gf-student">Ученик <select id="gfStudent" required></select></label>
        <label>Предмет <select id="gfSubject" required></select></label>
        <label>Дата <input id="gfDate" type="date" required></label>
      </div>
      <div class="gf-row gf-bottom">
        <fieldset class="marks">
          <legend>Оценка</legend>
          <label><input type="radio" name="gfValue" value="5" required><span class="g5">5</span></label>
          <label><input type="radio" name="gfValue" value="4"><span class="g4">4</span></label>
          <label><input type="radio" name="gfValue" value="3"><span class="g3">3</span></label>
          <label><input type="radio" name="gfValue" value="2"><span class="g2">2</span></label>
        </fieldset>
        <button id="gfBtn" type="submit">Поставить</button>
      </div>
      <div id="gfMsg" class="gf-msg" role="status"></div>
    </form>

    <div class="filters">
      <input id="q" type="search" placeholder="Поиск по фамилии или имени">
      <select id="cls"><option value="">Все классы</option></select>
      <select id="subj"><option value="">Все предметы</option></select>
    </div>

    <div class="stats" id="stats"></div>

    <div class="card">
      <table>
        <thead><tr><th>Дата</th><th>Ученик</th><th>Класс</th><th>Предмет</th><th>Оценка</th></tr></thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
  </section>

  <p id="loading" class="msg">Загружаю…</p>
</main>

<script>
  // Адрес базы и ПУБЛИЧНЫЙ ключ. Секретный ключ сюда не кладём никогда.
  // Без входа публичный ключ в базе не видит ничего. После входа база сама решает,
  // какие оценки показать: родителю оценки его детей, учителю оценки по его предметам.
  const SUPABASE_URL = "https://xjttipwrindzobwnbdnw.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_SxS_yTWNTwUx1_enK5q3RQ_HYaQOAwG";
  const LOGIN_DOMAIN = "school.test";   // логин volkova = учётная запись volkova@school.test
  const SESSION_KEY = "journal-session";

  const $ = id => document.getElementById(id);
  const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
  const fmtDate = d => new Date(d + "T00:00:00").toLocaleDateString("ru-RU");
  let session = null, journal = [];

  // --- Сессия (пропуск после входа) хранится в браузере, чтобы не входить каждый раз ---
  function saveSession(s) {
    session = s;
    try { s ? localStorage.setItem(SESSION_KEY, JSON.stringify(s)) : localStorage.removeItem(SESSION_KEY); } catch {}
  }
  function loadSession() {
    try { return JSON.parse(localStorage.getItem(SESSION_KEY)); } catch { return null; }
  }

  async function auth(grant, body) {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=${grant}`, {
      method: "POST",
      headers: { apikey: SUPABASE_PUBLISHABLE_KEY, "Content-Type": "application/json" },
      body: JSON.stringify(body)
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw Object.assign(new Error(data.error_description || data.msg || `код ${res.status}`), { status: res.status });
    return { access_token: data.access_token, refresh_token: data.refresh_token, expires_at: data.expires_at };
  }

  async function freshSession() {
    if (session && session.expires_at - 60 < Date.now() / 1000) {
      try { saveSession(await auth("refresh_token", { refresh_token: session.refresh_token })); }
      catch { saveSession(null); }
    }
    return session;
  }

  async function rpc(name) {
    const s = await freshSession();
    if (!s) throw Object.assign(new Error("нужно войти"), { status: 401 });
    const res = await fetch(`${SUPABASE_URL}/rest/v1/rpc/${name}`, {
      method: "POST",
      headers: { apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${s.access_token}`, "Content-Type": "application/json" },
      body: "{}"
    });
    if (!res.ok) throw Object.assign(new Error(`база ответила кодом ${res.status}`), { status: res.status });
    return res.json();
  }

  // Новая оценка пишется прямо в таблицу grades. Пустит её туда или нет,
  // решают правила RLS в базе («Оценки: ставит учитель»), а не эта страница.
  async function addGrade(row) {
    const s = await freshSession();
    if (!s) throw Object.assign(new Error("нужно войти"), { status: 401 });
    const res = await fetch(`${SUPABASE_URL}/rest/v1/grades`, {
      method: "POST",
      headers: { apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${s.access_token}`,
                 "Content-Type": "application/json", Prefer: "return=minimal" },
      body: JSON.stringify(row)
    });
    if (!res.ok) {
      const data = await res.json().catch(() => ({}));
      const denied = res.status === 403 || data.code === "42501";
      throw Object.assign(new Error(denied ? "у вас нет прав поставить эту оценку" : (data.message || `код ${res.status}`)),
                          { status: res.status });
    }
  }

  // --- Экраны ---
  function showLogin(message = "") {
    $("loading").hidden = true;
    $("journalView").hidden = true;
    $("loginForm").hidden = false;
    $("loginErr").textContent = message;
    $("login").focus();
  }

  async function showJournal() {
    $("loginForm").hidden = true;
    $("loading").hidden = false;
    try {
      const [profile] = await rpc("my_profile");
      journal = await rpc("get_journal");
      if (!profile) {
        saveSession(null);
        return showLogin("Эта учётная запись не привязана ни к родителю, ни к учителю.");
      }
      $("whoName").textContent = profile.full_name;
      $("whoScope").textContent = profile.role === "parent"
        ? `Родитель. Дети: ${profile.scope || "не указаны"}`
        : `Учитель. Предмет: ${profile.scope || "не указан"}`;
      fillSelect($("cls"), journal.map(r => r.class_name));
      fillSelect($("subj"), journal.map(r => r.subject));
      render();
      options = profile.role === "teacher" ? await rpc("my_grade_options") : [];
      setupGradeForm();
      $("loading").hidden = true;
      $("journalView").hidden = false;
    } catch (e) {
      if (e.status === 401) { saveSession(null); return showLogin("Время входа истекло, войдите снова."); }
      $("loading").innerHTML = `<span class="err">Не удалось загрузить журнал: ${esc(e.message)}</span>`;
    }
  }

  function fillSelect(el, values) {
    el.length = 1;
    [...new Set(values)].filter(Boolean).sort((a, b) => a.localeCompare(b, "ru"))
      .forEach(v => el.add(new Option(v, v)));
  }

  function render() {
    const q = $("q").value.trim().toLowerCase();
    const cls = $("cls").value, subj = $("subj").value;
    const list = journal.filter(r =>
      (!q || r.student.toLowerCase().includes(q)) &&
      (!cls || r.class_name === cls) &&
      (!subj || r.subject === subj));

    const avg = list.length ? (list.reduce((s, r) => s + r.grade, 0) / list.length).toFixed(2) : "–";
    const students = new Set(list.map(r => r.student)).size;
    $("stats").innerHTML = `<span>Оценок: <b>${list.length}</b></span>
      <span>Учеников: <b>${students}</b></span><span>Средний балл: <b>${avg}</b></span>`;

    let marked = false;
    const isFresh = r => !marked && lastAdded && r.student === lastAdded.student && r.subject === lastAdded.subject
                         && r.given_on === lastAdded.given_on && r.grade === lastAdded.grade && (marked = true);
    $("rows").innerHTML = list.length
      ? list.map(r => `<tr${isFresh(r) ? ' class="fresh"' : ""}>
          <td>${fmtDate(r.given_on)}</td><td>${esc(r.student)}</td><td>${esc(r.class_name)}</td>
          <td>${esc(r.subject)}</td><td><span class="grade g${r.grade}">${r.grade}</span></td></tr>`).join("")
      : `<tr><td colspan="5" class="msg">Ничего не найдено</td></tr>`;
  }

  // --- Форма оценки (только учитель) ---
  const today = () => new Date().toLocaleDateString("sv-SE");   // ГГГГ-ММ-ДД по местному времени

  function setupGradeForm() {
    const form = $("gradeForm");
    form.hidden = options.length === 0;
    if (form.hidden) return;

    const sel = $("gfStudent");
    const keep = sel.value;
    sel.length = 0;
    sel.add(new Option("Выберите ученика", ""));
    const byClass = {};
    options.forEach(o => { (byClass[o.class_name] ??= new Map()).set(o.student_id, o.student); });
    Object.keys(byClass).sort((a, b) => a.localeCompare(b, "ru")).forEach(cls => {
      const group = document.createElement("optgroup");
      group.label = `${cls} класс`;
      [...byClass[cls]].forEach(([id, name]) => group.append(new Option(name, id)));
      sel.append(group);
    });
    sel.value = keep;
    fillSubjects();
    $("gfDate").max = today();
    if (!$("gfDate").value) $("gfDate").value = today();
  }

  function fillSubjects() {
    const sid = Number($("gfStudent").value);
    const subs = options.filter(o => o.student_id === sid);
    const el = $("gfSubject"), keep = el.value;
    el.length = 0;
    if (!sid) el.add(new Option("Сначала выберите ученика", ""));
    subs.forEach(o => el.add(new Option(o.subject, o.subject_id)));
    if ([...el.options].some(o => o.value === keep)) el.value = keep;
  }

  function gfMessage(text, ok) {
    $("gfMsg").textContent = text;
    $("gfMsg").className = "gf-msg " + (ok ? "ok" : "err");
  }

  $("gfStudent").addEventListener("change", fillSubjects);

  $("gradeForm").addEventListener("change", e => {
    if (e.target.name === "gfValue" && e.target.value === "2")
      gfMessage("После двойки родителям автоматически уйдёт сообщение в Telegram.", false);
    else if (e.target.name === "gfValue") gfMessage("", true);
  });

  $("gradeForm").addEventListener("submit", async e => {
    e.preventDefault();
    const sid = Number($("gfStudent").value), subId = Number($("gfSubject").value);
    const opt = options.find(o => o.student_id === sid && o.subject_id === subId);
    const value = Number(new FormData(e.target).get("gfValue"));
    const date = $("gfDate").value;
    if (!opt) return gfMessage("Выберите ученика и предмет.", false);
    if (!value) return gfMessage("Выберите оценку.", false);
    if (!date || date > today()) return gfMessage("Дата не может быть в будущем.", false);

    $("gfBtn").disabled = true;
    try {
      await addGrade({ student_id: sid, subject_id: subId, teacher_id: opt.teacher_id, value, given_on: date });
      lastAdded = { student: opt.student, subject: opt.subject, given_on: date, grade: value };
      journal = await rpc("get_journal");
      fillSelect($("cls"), journal.map(r => r.class_name));
      fillSelect($("subj"), journal.map(r => r.subject));
      render();
      gfMessage(`Поставлена ${value} по предмету «${opt.subject}»: ${opt.student}, ${fmtDate(date)}.`, true);
      e.target.querySelectorAll('input[name="gfValue"]').forEach(r => r.checked = false);
    } catch (err) {
      if (err.status === 401) { saveSession(null); return showLogin("Время входа истекло, войдите снова."); }
      gfMessage(`Оценка не поставлена: ${err.message}.`, false);
    } finally {
      $("gfBtn").disabled = false;
    }
  });

  // --- Кнопки ---
  $("loginForm").addEventListener("submit", async e => {
    e.preventDefault();
    const login = $("login").value.trim().toLowerCase();
    const email = login.includes("@") ? login : `${login}@${LOGIN_DOMAIN}`;
    $("loginBtn").disabled = true;
    $("loginErr").textContent = "";
    try {
      saveSession(await auth("password", { email, password: $("password").value }));
      $("password").value = "";
      await showJournal();
    } catch (err) {
      $("loginErr").textContent = err.status === 400 ? "Неверный логин или пароль." : `Не удалось войти: ${err.message}`;
    } finally {
      $("loginBtn").disabled = false;
    }
  });

  $("logoutBtn").addEventListener("click", async () => {
    const s = session;
    saveSession(null);
    journal = [];
    $("q").value = "";
    showLogin();
    if (s) fetch(`${SUPABASE_URL}/auth/v1/logout`, {
      method: "POST", headers: { apikey: SUPABASE_PUBLISHABLE_KEY, Authorization: `Bearer ${s.access_token}` }
    }).catch(() => {});
  });

  ["q", "cls", "subj"].forEach(id => $(id).addEventListener("input", render));

  session = loadSession();
  session ? showJournal() : showLogin();
</script>
</body>
</html>
